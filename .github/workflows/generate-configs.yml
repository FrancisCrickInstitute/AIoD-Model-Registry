name: Generate Default Configs

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # On PRs: fail if committed configs are stale relative to the manifests
  check-configs:
    name: Check configs are up to date
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install package
        run: pip install -e .

      - name: Regenerate configs
        run: aiod-gen-configs

      - name: Fail if configs are stale
        run: |
          git add aiod_registry/default_configs/
          git diff --cached --exit-code || \
            (echo "::error::Default configs are out of date. Run `aiod-gen-configs` command locally and commit the results." && exit 1)

  # On merge to main: regenerate and commit any changes
  update-configs:
    name: Update and commit default configs
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install package
        run: pip install -e .

      - name: Generate configs
        run: aiod-gen-configs

      - name: Commit and push updated configs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add aiod_registry/default_configs/
          git diff --cached --quiet || git commit -m "chore: regenerate default configs [skip ci]"
          git push

name: Generate JSON Schema

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # On PRs: fail if the committed schema is stale relative to schema.py
  check-schema:
    name: Check schema.json is up to date
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install package
        run: pip install -e .

      - name: Regenerate schema
        run: aiod-gen-schema

      - name: Fail if schema is stale
        run: |
          git add aiod_registry/schema.json
          git diff --cached --exit-code || \
            (echo "::error::schema.json is out of date. Run `aiod-gen-schema` command locally and commit the results." && exit 1)

  # On merge to main: regenerate and commit any changes
  update-schema:
    name: Update and commit schema.json
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install package
        run: pip install -e .

      - name: Generate schema
        run: aiod-gen-schema

      - name: Commit and push updated schema
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add aiod_registry/schema.json
          git diff --cached --quiet || git commit -m "chore: regenerate schema.json [skip ci]"
          git push
